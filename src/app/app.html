<mat-toolbar color="primary">
      <button mat-button (click)="drawer.toggle()">☰</button>
      <span style="margin-left: 8px;">EARS</span>
    </mat-toolbar>

    <mat-sidenav-container style="height: calc(100vh - 64px);">
      <mat-sidenav #drawer mode="side" opened>
        
          <mat-nav-list>
            @for (link of navLinks; track link.path) {
            <a mat-list-item [routerLink]="link.path">{{link.label}}</a>
            }
          </mat-nav-list>
         
      </mat-sidenav>

      <mat-sidenav-content style="padding: 16px;">
        <router-outlet></router-outlet>
      </mat-sidenav-content>
    </mat-sidenav-container>
